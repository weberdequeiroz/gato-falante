<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#7cc6f2">
<title>Miguel, o Gato Falante</title>
<style>
  :root {
    --ceu-1: #7cc6f2;
    --ceu-2: #c9ecff;
    --chao: #8fd36b;
    --chao-escuro: #6fb84d;
    --texto: #2a3a4a;
    --balao: #ffffff;
    --botao: #ffffff;
    --botao-ativo: #ffb43a;
    --pelo: #f39a3b;
    --pelo-escuro: #d97a1f;
    --creme: #fde3c2;
    --gravando: #ff4d6d;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --ceu-1: #24345c;
      --ceu-2: #3d5a8a;
      --chao: #3f7a3a;
      --chao-escuro: #31622d;
      --texto: #f2f5fa;
      --balao: #fdfdfd;
      --botao: #2f3e5e;
    }
  }
  :root[data-theme="dark"] {
    --ceu-1: #24345c;
    --ceu-2: #3d5a8a;
    --chao: #3f7a3a;
    --chao-escuro: #31622d;
    --texto: #f2f5fa;
    --balao: #fdfdfd;
    --botao: #2f3e5e;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; }
  body {
    background: linear-gradient(var(--ceu-1), var(--ceu-2) 65%, var(--chao) 65%, var(--chao-escuro));
    color: var(--texto);
    font-family: "Comic Sans MS", "Chalkboard SE", "Baloo 2", system-ui, sans-serif;
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
    touch-action: manipulation;
  }
  main {
    height: 100%;
    max-width: 560px;
    margin: 0 auto;
    padding: 16px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
  }
  h1 {
    margin: 4px 0 0;
    font-size: clamp(26px, 7vw, 38px);
    color: #fff;
    text-shadow: 0 3px 0 rgba(0,0,0,.18);
    letter-spacing: 1px;
  }
  .balao {
    position: relative;
    background: var(--balao);
    color: #2a3a4a;
    border-radius: 22px;
    padding: 10px 18px;
    font-size: clamp(17px, 4.6vw, 22px);
    min-height: 1.4em;
    text-align: center;
    box-shadow: 0 4px 0 rgba(0,0,0,.12);
    transition: transform .2s;
  }
  .balao::after {
    content: "";
    position: absolute;
    left: 50%;
    bottom: -12px;
    transform: translateX(-50%);
    border: 12px solid transparent;
    border-top-color: var(--balao);
    border-bottom: 0;
  }
  .balao.pulo { transform: scale(1.08); }

  #palco {
    position: relative;
    flex: 1;
    width: 100%;
    min-height: 0;
    display: flex;
    align-items: flex-end;
    justify-content: center;
  }
  #gato {
    height: 100%;
    max-height: 520px;
    width: auto;
    max-width: 100%;
    cursor: pointer;
    overflow: visible;
    filter: drop-shadow(0 8px 0 rgba(0,0,0,.12));
  }

  /* respiração */
  #corpo-todo { transform-origin: 200px 470px; animation: respira 3s ease-in-out infinite; }
  @keyframes respira { 50% { transform: scale(1.015, .985); } }

  #rabo { transform-origin: 290px 400px; animation: rabo 2.4s ease-in-out infinite; }
  @keyframes rabo { 50% { transform: rotate(14deg); } }

  .olho-fechado { display: none; }
  #gato.piscando .olho-aberto { display: none; }
  #gato.piscando .olho-fechado { display: inline; }

  #orelha-e, #orelha-d { transition: transform .25s; }
  #orelha-e { transform-origin: 130px 120px; }
  #orelha-d { transform-origin: 270px 120px; }
  #gato.ouvindo #orelha-e { animation: orelha-e .5s ease-in-out infinite; }
  #gato.ouvindo #orelha-d { animation: orelha-d .5s ease-in-out infinite; }
  @keyframes orelha-e { 50% { transform: rotate(-10deg); } }
  @keyframes orelha-d { 50% { transform: rotate(10deg); } }

  #cabeca { transform-origin: 200px 260px; transition: transform .3s; }
  #gato.ouvindo #cabeca { transform: rotate(-7deg); }
  #gato.falando #cabeca { animation: balanca .6s ease-in-out infinite; }
  @keyframes balanca { 25% { transform: rotate(-3deg); } 75% { transform: rotate(3deg); } }
  #gato.cutucado #corpo-todo { animation: pulinho .35s ease-out; }
  @keyframes pulinho { 40% { transform: translateY(-18px) scale(1.03, .97); } }

  #mao-orelha { display: none; }
  #gato.ouvindo #mao-orelha { display: inline; }
  #gato.ouvindo #braco-e { display: none; }

  #boca-aberta { transform-origin: 200px 262px; transform: scaleY(0); }

  .anel {
    position: absolute;
    left: 50%;
    bottom: 34%;
    width: 120px; height: 120px;
    margin-left: -60px;
    border-radius: 50%;
    border: 6px solid var(--gravando);
    opacity: 0;
    pointer-events: none;
  }
  .ouvindo-on .anel { opacity: .55; }

  .nota {
    position: absolute;
    font-size: 30px;
    pointer-events: none;
    animation: sobe 1.6s ease-out forwards;
  }
  @keyframes sobe {
    from { transform: translateY(0) scale(.6); opacity: 1; }
    to { transform: translateY(-160px) scale(1.2) rotate(20deg); opacity: 0; }
  }

  .vozes {
    display: flex;
    flex-wrap: wrap;
    width: 100%;
    justify-content: center;
    gap: 8px;
  }
  .vozes.destaque button { animation: chama .5s ease-in-out 4; }
  @keyframes chama { 50% { transform: translateY(-8px); } }

  #ajuda {
    position: absolute;
    top: 12px;
    right: 0;
    width: 44px; height: 44px;
    border: 0;
    border-radius: 50%;
    font: inherit;
    font-size: 24px;
    font-weight: bold;
    background: var(--botao);
    color: var(--texto);
    box-shadow: 0 3px 0 rgba(0,0,0,.18);
    cursor: pointer;
    z-index: 5;
  }

  #boas-vindas {
    position: fixed;
    inset: 0;
    z-index: 20;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
    background: rgba(20, 40, 70, .55);
  }
  #boas-vindas[hidden] { display: none; }
  #boas-vindas .cartao {
    background: var(--balao);
    color: #2a3a4a;
    border-radius: 28px;
    padding: 24px 28px;
    text-align: center;
    box-shadow: 0 6px 0 rgba(0,0,0,.18);
    font-size: 22px;
  }
  #boas-vindas .patinha { font-size: 54px; }
  #boas-vindas p { margin: 8px 0 18px; }
  #comecar {
    font: inherit;
    font-size: 26px;
    border: 0;
    border-radius: 22px;
    padding: 14px 30px;
    background: var(--botao-ativo);
    color: #3a2400;
    box-shadow: 0 5px 0 #c97f12;
    cursor: pointer;
    animation: chama 1s ease-in-out infinite;
  }

  footer {
    font-size: 13px;
    font-weight: bold;
    letter-spacing: 1px;
    color: #fff;
    text-shadow: 0 1px 2px rgba(0,0,0,.35);
    text-align: center;
    padding-bottom: env(safe-area-inset-bottom);
  }
  .vozes button {
    font: inherit;
    font-size: clamp(15px, 4vw, 18px);
    border: 0;
    border-radius: 18px;
    padding: 10px 6px;
    background: var(--botao);
    color: var(--texto);
    box-shadow: 0 4px 0 rgba(0,0,0,.18);
    cursor: pointer;
    flex: 0 1 calc(25% - 6px);
    min-width: 0;
    max-width: 110px;
  }
  .vozes button:active { transform: translateY(3px); box-shadow: 0 1px 0 rgba(0,0,0,.18); }
  .vozes button[aria-pressed="true"] { background: var(--botao-ativo); color: #3a2400; }
  .vozes .emoji { display: block; font-size: 24px; line-height: 1.1; }
  .vozes .nome { display: block; font-size: .85em; line-height: 1.15; overflow-wrap: anywhere; }
</style>
</head>
<body>
<main>
  <h1>Miguel, o Gato Falante</h1>
  <div class="balao" id="balao">Oi! Eu sou o Miguel. Toque em mim e fale!</div>

  <div id="palco">
    <button id="ajuda" aria-label="Miguel explica como brincar">?</button>
    <div class="anel" id="anel"></div>
    <svg id="gato" viewBox="0 0 400 500" role="button" aria-label="Miguel, o gato: toque para falar">
      <g id="corpo-todo">
        <!-- sombra -->
        <ellipse cx="200" cy="482" rx="130" ry="14" fill="rgba(0,0,0,.15)"/>
        <!-- rabo -->
        <path id="rabo" d="M285 420 C 360 410, 380 330, 340 290 C 330 280, 318 292, 326 302 C 352 336, 336 390, 280 395 Z"
              fill="var(--pelo)" stroke="var(--pelo-escuro)" stroke-width="4" stroke-linejoin="round"/>
        <!-- corpo -->
        <path d="M110 480 C 95 400, 120 330, 200 325 C 280 330, 305 400, 290 480 Z"
              fill="var(--pelo)" stroke="var(--pelo-escuro)" stroke-width="4"/>
        <path d="M150 478 C 145 420, 165 375, 200 372 C 235 375, 255 420, 250 478 Z" fill="var(--creme)"/>
        <!-- patas -->
        <ellipse cx="160" cy="476" rx="30" ry="16" fill="var(--creme)" stroke="var(--pelo-escuro)" stroke-width="4"/>
        <ellipse cx="240" cy="476" rx="30" ry="16" fill="var(--creme)" stroke="var(--pelo-escuro)" stroke-width="4"/>
        <!-- braços -->
        <path id="braco-e" d="M128 360 C 110 400, 120 440, 150 450" fill="none" stroke="var(--pelo-escuro)" stroke-width="26" stroke-linecap="round"/>
        <path d="M128 360 C 110 400, 120 440, 150 450" fill="none" stroke="var(--pelo)" stroke-width="18" stroke-linecap="round" class="braco-e-in"/>
        <path d="M272 360 C 290 400, 280 440, 250 450" fill="none" stroke="var(--pelo-escuro)" stroke-width="26" stroke-linecap="round"/>
        <path d="M272 360 C 290 400, 280 440, 250 450" fill="none" stroke="var(--pelo)" stroke-width="18" stroke-linecap="round"/>

        <g id="cabeca">
          <!-- orelhas -->
          <g id="orelha-e">
            <path d="M95 175 L 105 55 L 190 120 Z" fill="var(--pelo)" stroke="var(--pelo-escuro)" stroke-width="5" stroke-linejoin="round"/>
            <path d="M115 150 L 120 85 L 168 122 Z" fill="#ffb3c1"/>
          </g>
          <g id="orelha-d">
            <path d="M305 175 L 295 55 L 210 120 Z" fill="var(--pelo)" stroke="var(--pelo-escuro)" stroke-width="5" stroke-linejoin="round"/>
            <path d="M285 150 L 280 85 L 232 122 Z" fill="#ffb3c1"/>
          </g>
          <!-- cabeça -->
          <ellipse cx="200" cy="215" rx="125" ry="105" fill="var(--pelo)" stroke="var(--pelo-escuro)" stroke-width="5"/>
          <!-- listras -->
          <path d="M200 112 L 200 150 M178 115 L 182 145 M222 115 L 218 145" stroke="var(--pelo-escuro)" stroke-width="7" stroke-linecap="round"/>
          <!-- focinho -->
          <ellipse cx="200" cy="255" rx="62" ry="45" fill="var(--creme)"/>
          <!-- bochechas -->
          <ellipse cx="118" cy="250" rx="18" ry="11" fill="#ff9aae" opacity=".6"/>
          <ellipse cx="282" cy="250" rx="18" ry="11" fill="#ff9aae" opacity=".6"/>

          <!-- olhos abertos -->
          <g class="olho-aberto">
            <ellipse cx="155" cy="200" rx="26" ry="32" fill="#fff" stroke="#3a2a1a" stroke-width="4"/>
            <ellipse cx="245" cy="200" rx="26" ry="32" fill="#fff" stroke="#3a2a1a" stroke-width="4"/>
            <g id="pupilas">
              <ellipse cx="160" cy="205" rx="14" ry="19" fill="#4a8c2a"/>
              <ellipse cx="240" cy="205" rx="14" ry="19" fill="#4a8c2a"/>
              <ellipse cx="160" cy="207" rx="7" ry="13" fill="#1a1a1a"/>
              <ellipse cx="240" cy="207" rx="7" ry="13" fill="#1a1a1a"/>
              <circle cx="164" cy="197" r="5" fill="#fff"/>
              <circle cx="244" cy="197" r="5" fill="#fff"/>
            </g>
          </g>
          <!-- olhos fechados (piscar) -->
          <g class="olho-fechado" fill="none" stroke="#3a2a1a" stroke-width="5" stroke-linecap="round">
            <path d="M132 205 Q 155 222 178 205"/>
            <path d="M222 205 Q 245 222 268 205"/>
          </g>

          <!-- nariz -->
          <path d="M188 236 L 212 236 L 200 250 Z" fill="#ff6b8b" stroke="#c94a68" stroke-width="3" stroke-linejoin="round"/>
          <!-- boca fechada -->
          <path id="boca-fechada" d="M200 250 L 200 262 M200 262 Q 188 276 176 264 M200 262 Q 212 276 224 264"
                fill="none" stroke="#3a2a1a" stroke-width="4" stroke-linecap="round"/>
          <!-- boca aberta -->
          <g id="boca-aberta">
            <ellipse cx="200" cy="278" rx="26" ry="22" fill="#7a1f2b" stroke="#3a2a1a" stroke-width="4"/>
            <ellipse cx="200" cy="290" rx="15" ry="8" fill="#ff7b93"/>
          </g>
          <!-- bigodes -->
          <g stroke="#3a2a1a" stroke-width="3" stroke-linecap="round">
            <path d="M140 255 L 70 240"/><path d="M140 265 L 68 268"/><path d="M142 275 L 76 295"/>
            <path d="M260 255 L 330 240"/><path d="M260 265 L 332 268"/><path d="M258 275 L 324 295"/>
          </g>
        </g>

        <!-- mão na orelha (quando está ouvindo) -->
        <g id="mao-orelha">
          <path d="M128 360 C 70 320, 70 230, 92 175" fill="none" stroke="var(--pelo-escuro)" stroke-width="26" stroke-linecap="round"/>
          <path d="M128 360 C 70 320, 70 230, 92 175" fill="none" stroke="var(--pelo)" stroke-width="18" stroke-linecap="round"/>
          <ellipse cx="92" cy="172" rx="20" ry="17" fill="var(--creme)" stroke="var(--pelo-escuro)" stroke-width="4"/>
        </g>
      </g>
    </svg>
  </div>

  <div class="vozes" id="vozes">
    <button data-voz="esquilo" aria-pressed="true"><span class="emoji">🐭</span><span class="nome">Fininha</span></button>
    <button data-voz="dani" aria-pressed="false"><span class="emoji">🐿️</span><span class="nome">Tia Dani</span></button>
    <button data-voz="bob" aria-pressed="false"><span class="emoji">🧽</span><span class="nome">Bob Esponja</span></button>
    <button data-voz="pirata" aria-pressed="false"><span class="emoji">🏴‍☠️</span><span class="nome">Pirata</span></button>
    <button data-voz="gatinho" aria-pressed="false"><span class="emoji">🐱</span><span class="nome">Gatinho</span></button>
    <button data-voz="monstro" aria-pressed="false"><span class="emoji">👹</span><span class="nome">Monstro</span></button>
    <button data-voz="robo" aria-pressed="false"><span class="emoji">🤖</span><span class="nome">Robô</span></button>
  </div>
  <footer>DESENVOLVIDO POR VINI &amp; WEBER</footer>
</main>

<div id="boas-vindas" hidden>
  <div class="cartao">
    <div class="patinha">🐾</div>
    <p>O Miguel quer te conhecer!</p>
    <button id="comecar">▶ Começar</button>
  </div>
</div>

<script>
(() => {
  const gato = document.getElementById('gato');
  const balao = document.getElementById('balao');
  const palco = document.getElementById('palco');
  const anel = document.getElementById('anel');
  const bocaAberta = document.getElementById('boca-aberta');
  const bocaFechada = document.getElementById('boca-fechada');
  const bracoEIn = document.querySelector('.braco-e-in');

  // Vozes: velocidade de reprodução (muda o tom) e efeitos opcionais
  //   tremido: voz tremendo   nasal: voz pelo nariz   rouco: voz arranhada
  //   eco: repete no fundo    brilho: mais agudos      robo: voz metálica
  const VOZES = {
    esquilo: { velocidade: 1.6 },
    dani:    { velocidade: 2.0, brilho: true, frases: ['Hihihi! Oi, eu sou a tia Dani! 🐿️', 'Tia Dani na área! 🐿️'] },
    bob:     { velocidade: 1.3, nasal: true, tremido: { hz: 7, forca: 0.05 }, frases: ['Estou pronto! Estou pronto! 🧽', 'Ahahahaha! 🧽'] },
    pirata:  { velocidade: 0.82, rouco: true, eco: true, tremido: { hz: 3, forca: 0.03 }, frases: ['Arrr, marujo! 🏴‍☠️', 'Ahoy! Ao mar! ☠️'] },
    gatinho: { velocidade: 1.35 },
    monstro: { velocidade: 0.7 },
    robo:    { velocidade: 1.1, robo: true },
  };
  let vozAtual = 'esquilo';

  // Detecção de fala
  const LIMIAR_FALA = 0.03;      // volume que conta como fala
  const SILENCIO_FIM = 1100;     // ms de silêncio depois de falar para parar
  const ESPERA_MAX = 6000;       // ms esperando a criança começar a falar
  const GRAVACAO_MAX = 10000;    // ms de gravação no máximo

  let ctx = null, microfone = null, processador = null;
  let estado = 'parado'; // parado | apresentando | ouvindo | falando
  let pedacos = [], inicioGravacao = 0, comecouFalar = false, ultimoSom = 0, indiceInicioFala = 0;

  function falar(texto) {
    balao.textContent = texto;
    balao.classList.add('pulo');
    setTimeout(() => balao.classList.remove('pulo'), 200);
  }

  function setEstado(novo) {
    estado = novo;
    gato.classList.toggle('ouvindo', novo === 'ouvindo');
    gato.classList.toggle('falando', novo === 'falando' || novo === 'apresentando');
    palco.classList.toggle('ouvindo-on', novo === 'ouvindo');
    bracoEIn.style.display = novo === 'ouvindo' ? 'none' : '';
    if (novo !== 'falando') abrirBoca(0);
    if (novo !== 'ouvindo') anel.style.transform = 'scale(1)';
  }

  function abrirBoca(n) {
    n = Math.max(0, Math.min(1, n));
    bocaAberta.style.transform = `scaleY(${n})`;
    bocaFechada.style.opacity = n > 0.15 ? 0 : 1;
  }

  async function prepararAudio() {
    if (ctx) {
      if (ctx.state === 'suspended') await ctx.resume();
      return;
    }
    const Ctx = window.AudioContext || window.webkitAudioContext;
    ctx = new Ctx();
    const stream = await navigator.mediaDevices.getUserMedia({
      audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true },
    });
    microfone = ctx.createMediaStreamSource(stream);
    processador = ctx.createScriptProcessor(2048, 1, 1);
    processador.onaudioprocess = aoReceberAudio;
    const mudo = ctx.createGain();
    mudo.gain.value = 0;
    microfone.connect(processador);
    processador.connect(mudo);
    mudo.connect(ctx.destination);
  }

  function aoReceberAudio(e) {
    if (estado !== 'ouvindo') return;
    const dados = new Float32Array(e.inputBuffer.getChannelData(0));
    pedacos.push(dados);

    let soma = 0;
    for (let i = 0; i < dados.length; i++) soma += dados[i] * dados[i];
    const volume = Math.sqrt(soma / dados.length);
    anel.style.transform = `scale(${1 + Math.min(volume * 12, 1.6)})`;

    const agora = performance.now();
    if (volume > LIMIAR_FALA) {
      if (!comecouFalar) {
        comecouFalar = true;
        // guarda um pouquinho do áudio antes da fala começar
        indiceInicioFala = Math.max(0, pedacos.length - 4);
      }
      ultimoSom = agora;
    }

    if (comecouFalar && agora - ultimoSom > SILENCIO_FIM) pararDeOuvir();
    else if (!comecouFalar && agora - inicioGravacao > ESPERA_MAX) {
      setEstado('parado');
      falar('Não ouvi nada... Toque em mim e fale mais alto!');
    } else if (agora - inicioGravacao > GRAVACAO_MAX) pararDeOuvir();
  }

  async function comecarAOuvir() {
    try {
      await prepararAudio();
    } catch (err) {
      console.error(err);
      falar('Preciso do microfone! Permita o acesso e toque de novo.');
      ctx = null;
      return;
    }
    pedacos = [];
    comecouFalar = false;
    indiceInicioFala = 0;
    inicioGravacao = performance.now();
    setEstado('ouvindo');
    falar('Estou ouvindo... 👂');
  }

  function pararDeOuvir() {
    if (estado !== 'ouvindo') return;
    if (!comecouFalar) {
      setEstado('parado');
      falar('Não ouvi nada... Toque em mim e fale!');
      return;
    }
    // corta o silêncio do fim (mantém ~0,25 s)
    const tamPedaco = pedacos[0].length;
    const sobraFinal = Math.ceil((SILENCIO_FIM / 1000) * ctx.sampleRate / tamPedaco) - 3;
    const fim = Math.max(indiceInicioFala + 1, pedacos.length - Math.max(0, sobraFinal));
    const usados = pedacos.slice(indiceInicioFala, fim);
    repetir(usados);
  }

  function repetir(lista) {
    const total = lista.reduce((n, p) => n + p.length, 0);
    const buffer = ctx.createBuffer(1, total, ctx.sampleRate);
    const canal = buffer.getChannelData(0);
    let pos = 0, pico = 0;
    for (const p of lista) { canal.set(p, pos); pos += p.length; }
    for (let i = 0; i < total; i++) pico = Math.max(pico, Math.abs(canal[i]));
    // deixa a voz bem audível
    const ganho = pico > 0 ? Math.min(0.95 / pico, 8) : 1;
    for (let i = 0; i < total; i++) canal[i] *= ganho;

    const voz = VOZES[vozAtual];
    const fonte = ctx.createBufferSource();
    fonte.buffer = buffer;
    fonte.playbackRate.value = voz.velocidade;

    const analisador = ctx.createAnalyser();
    analisador.fftSize = 512;
    let saida = fonte;
    const osciladores = [];
    const ligar = (no) => { saida.connect(no); saida = no; };

    if (voz.tremido) {
      const lfo = ctx.createOscillator();
      const forca = ctx.createGain();
      lfo.frequency.value = voz.tremido.hz;
      forca.gain.value = voz.velocidade * voz.tremido.forca;
      lfo.connect(forca);
      forca.connect(fonte.playbackRate);
      osciladores.push(lfo);
    }
    if (voz.robo) {
      const modulador = ctx.createGain();
      modulador.gain.value = 0;
      const osc = ctx.createOscillator();
      osc.type = 'square';
      osc.frequency.value = 60;
      osc.connect(modulador.gain);
      osciladores.push(osc);
      ligar(modulador);
    }
    if (voz.nasal) {
      const grave = ctx.createBiquadFilter();
      grave.type = 'highpass';
      grave.frequency.value = 450;
      ligar(grave);
      const nariz = ctx.createBiquadFilter();
      nariz.type = 'peaking';
      nariz.frequency.value = 1500;
      nariz.Q.value = 2;
      nariz.gain.value = 14;
      ligar(nariz);
    }
    if (voz.brilho) {
      const agudo = ctx.createBiquadFilter();
      agudo.type = 'highshelf';
      agudo.frequency.value = 3000;
      agudo.gain.value = 6;
      ligar(agudo);
    }
    if (voz.rouco) {
      const arranhado = ctx.createWaveShaper();
      arranhado.curve = curvaRouca(25);
      arranhado.oversample = '4x';
      ligar(arranhado);
      const abafado = ctx.createBiquadFilter();
      abafado.type = 'lowpass';
      abafado.frequency.value = 2800;
      ligar(abafado);
      const volume = ctx.createGain();
      volume.gain.value = 0.6;
      ligar(volume);
    }
    if (voz.eco) {
      const atraso = ctx.createDelay(1);
      const volta = ctx.createGain();
      atraso.delayTime.value = 0.22;
      volta.gain.value = 0.35;
      saida.connect(atraso);
      atraso.connect(volta);
      volta.connect(atraso);
      volta.connect(analisador);
    }
    for (const osc of osciladores) osc.start();
    saida.connect(analisador);
    analisador.connect(ctx.destination);

    setEstado('falando');
    const frases = voz.frases || ['Hihihi! 😹', 'Olha eu falando! 😸', 'Miau! 🎶', 'Eu sou o Miguel! 😺'];
    falar(frases[Math.floor(Math.random() * frases.length)]);

    const amostras = new Float32Array(analisador.fftSize);
    let animando = true;
    let ultimaNota = 0;
    (function animar(t) {
      if (!animando) return;
      analisador.getFloatTimeDomainData(amostras);
      let soma = 0;
      for (let i = 0; i < amostras.length; i++) soma += amostras[i] * amostras[i];
      const vol = Math.sqrt(soma / amostras.length);
      abrirBoca(vol * 4.5);
      if (vol > 0.08 && t - ultimaNota > 350) { soltarNota(); ultimaNota = t; }
      requestAnimationFrame(animar);
    })(0);

    fonte.onended = () => {
      animando = false;
      for (const osc of osciladores) osc.stop();
      setEstado('parado');
      falar('Fala mais comigo! Toque no Miguel! 😺');
    };
    fonte.start();
  }

  function curvaRouca(k) {
    const n = 1024, curva = new Float32Array(n);
    for (let i = 0; i < n; i++) {
      const x = (i * 2) / n - 1;
      curva[i] = ((1 + k) * x) / (1 + k * Math.abs(x));
    }
    return curva;
  }

  function soltarNota() {
    const n = document.createElement('div');
    n.className = 'nota';
    n.textContent = ['🎵', '🎶', '💛', '⭐'][Math.floor(Math.random() * 4)];
    const r = palco.getBoundingClientRect();
    n.style.left = (r.width / 2 + (Math.random() * 160 - 80)) + 'px';
    n.style.top = (r.height * 0.35) + 'px';
    palco.appendChild(n);
    setTimeout(() => n.remove(), 1700);
  }

  function aoTocarGato(e) {
    e.preventDefault();
    gato.classList.remove('cutucado');
    void gato.getBoundingClientRect();
    gato.classList.add('cutucado');
    if (estado === 'apresentando') {
      pararApresentacao();
      comecarAOuvir();
    } else if (estado === 'parado') comecarAOuvir();
    else if (estado === 'ouvindo') pararDeOuvir();
  }
  gato.addEventListener('pointerdown', aoTocarGato);

  document.getElementById('vozes').addEventListener('click', (e) => {
    const b = e.target.closest('button');
    if (!b) return;
    vozAtual = b.dataset.voz;
    for (const outro of document.querySelectorAll('.vozes button')) {
      outro.setAttribute('aria-pressed', String(outro === b));
    }
    falar('Voz ' + b.querySelector('.nome').textContent + '! Toque em mim e fale.');
  });

  // piscar de vez em quando
  (function piscar() {
    setTimeout(() => {
      if (estado !== 'falando') {
        gato.classList.add('piscando');
        setTimeout(() => gato.classList.remove('piscando'), 160);
      }
      piscar();
    }, 2000 + Math.random() * 3000);
  })();

  // Apresentação: na primeira visita o Miguel se apresenta e explica o jogo
  const APRESENTACAO = [
    { texto: 'Oi! Eu sou o Miguel, o gato falante! 😺' },
    { texto: 'Toque em mim e fale alguma coisa. 👆' },
    { texto: 'Quando você parar de falar, eu repito com uma voz engraçada! 😹' },
    { texto: 'Aqui embaixo você escolhe a minha voz: tem tia Dani, Bob Esponja, pirata, monstro, robô e muito mais! 👇', vozes: true },
    { texto: 'Vamos brincar? Toque em mim! 🐾' },
  ];
  const vozesBarra = document.getElementById('vozes');
  const boasVindas = document.getElementById('boas-vindas');
  let apresentacaoId = 0, mexendoBoca = null;

  function vozPortugues() {
    if (!('speechSynthesis' in window)) return null;
    const lista = speechSynthesis.getVoices();
    return lista.find(v => v.lang === 'pt-BR') || lista.find(v => v.lang.startsWith('pt')) || null;
  }

  function narrar(texto, pronto) {
    const inicio = performance.now();
    const minimo = 700 + texto.length * 40;
    let acabou = false;
    clearInterval(mexendoBoca);
    const boca = setInterval(() => abrirBoca(0.25 + Math.random() * 0.75), 110);
    mexendoBoca = boca;
    const fim = () => {
      if (acabou) return;
      acabou = true;
      // se a voz do aparelho falhar, ainda dá tempo de ler o balão
      setTimeout(() => {
        clearInterval(boca);
        if (mexendoBoca === boca) abrirBoca(0);
        pronto();
      }, Math.max(0, minimo - (performance.now() - inicio)));
    };
    if ('speechSynthesis' in window) {
      const u = new SpeechSynthesisUtterance(texto.replace(/[^\p{L}\p{N}\s,.!?:]/gu, ''));
      u.lang = 'pt-BR';
      u.pitch = 1.9;
      u.rate = 1.05;
      const voz = vozPortugues();
      if (voz) u.voice = voz;
      u.onend = fim;
      u.onerror = fim;
      speechSynthesis.cancel();
      speechSynthesis.speak(u);
      setTimeout(fim, minimo * 3);
    } else {
      fim();
    }
  }

  function apresentar() {
    const id = ++apresentacaoId;
    try { localStorage.setItem('miguel-apresentou', '1'); } catch (e) {}
    setEstado('apresentando');
    let i = 0;
    const proxima = () => {
      if (id !== apresentacaoId) return;
      if (i >= APRESENTACAO.length) {
        vozesBarra.classList.remove('destaque');
        setEstado('parado');
        return;
      }
      const frase = APRESENTACAO[i++];
      falar(frase.texto);
      vozesBarra.classList.toggle('destaque', !!frase.vozes);
      narrar(frase.texto, () => setTimeout(proxima, 300));
    };
    proxima();
  }

  function pararApresentacao() {
    apresentacaoId++;
    clearInterval(mexendoBoca);
    if ('speechSynthesis' in window) speechSynthesis.cancel();
    vozesBarra.classList.remove('destaque');
    setEstado('parado');
  }

  document.getElementById('comecar').addEventListener('click', () => {
    boasVindas.hidden = true;
    apresentar();
  });
  document.getElementById('ajuda').addEventListener('click', () => {
    if (estado === 'parado' || estado === 'apresentando') apresentar();
  });

  let jaApresentou = false;
  try { jaApresentou = localStorage.getItem('miguel-apresentou') === '1'; } catch (e) {}
  if (!jaApresentou) boasVindas.hidden = false;
  if ('speechSynthesis' in window) speechSynthesis.getVoices();

  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    falar('Abra este jogo em https (ou no navegador do celular) para usar o microfone.');
  }
})();
</script>
