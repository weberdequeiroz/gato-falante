<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#cfeafb">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Miguel">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icones/icone-192.png">
<link rel="apple-touch-icon" href="icones/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap">
<title>Miguel, o Gato Falante</title>
<style>
  /* Uma tela só, de cima para baixo: topo com ajuda → aviso do que está acontecendo → Miguel → ações grandes → vozes.
     Cores calmas e sempre iguais, botões grandes com ícone + palavra, um estado de cada vez. */
  :root {
    --ceu: #cfeafb;
    --ceu-claro: #eef8fe;
    --grama: #b9e19f;
    --grama-escura: #98cf7a;
    --tinta: #1f2d3d;
    --tinta-suave: #50606f;
    --cartao: #ffffff;
    --linha: #dbe5ee;
    --laranja: #e9781a;
    --laranja-claro: #fff0e0;
    --lilas: #6d5bd0;
    --lilas-claro: #efebff;
    --amarelo: #a86f00;
    --amarelo-claro: #fff4cc;
    --vermelho: #d93d42;
    --vermelho-claro: #ffe6e6;
    --verde: #2f8a3e;
    --pelo: #f39a3b;
    --pelo-escuro: #d97a1f;
    --creme: #fde3c2;
    --sombra: 0 1px 0 rgba(31,45,61,.06), 0 6px 18px rgba(31,45,61,.10);
    --fonte: "Nunito", "Trebuchet MS", "Segoe UI", system-ui, sans-serif;
    color-scheme: light;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; }
  body {
    background: linear-gradient(var(--ceu-claro), var(--ceu) 55%, var(--grama) 55%, var(--grama-escura));
    color: var(--tinta);
    font-family: var(--fonte);
    font-weight: 700;
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
    touch-action: manipulation;
  }
  button { font: inherit; color: inherit; cursor: pointer; }
  button:focus-visible { outline: 4px solid var(--lilas); outline-offset: 3px; }

  .app {
    height: 100%;
    max-width: 560px;
    margin: 0 auto;
    padding-top: calc(10px + env(safe-area-inset-top, 0px));
    padding-bottom: calc(6px + env(safe-area-inset-bottom, 0px));
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  /* topo */
  .topo { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .marca { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .marca img { width: 44px; height: 44px; border-radius: 14px; box-shadow: var(--sombra); }
  .marca strong { display: block; font-size: 22px; font-weight: 900; line-height: 1; }
  .marca span { display: block; font-size: 14px; color: var(--tinta-suave); }
  .topo-botoes { display: flex; gap: 8px; }
  .botao-icone {
    min-width: 56px;
    height: 56px;
    border: 2px solid var(--linha);
    border-radius: 18px;
    background: var(--cartao);
    box-shadow: var(--sombra);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 2px 8px;
    gap: 0;
  }
  .botao-icone .simbolo { font-size: 22px; line-height: 1.1; }
  .botao-icone .rotulo { font-size: 12px; color: var(--tinta-suave); }
  .botao-icone[aria-pressed="true"] { border-color: var(--lilas); background: var(--lilas-claro); }
  .botao-icone[aria-pressed="true"] .rotulo { color: var(--lilas); }

  /* palco */
  #palco { flex: 1; min-height: 0; display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .estado {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 6px 14px;
    border-radius: 999px;
    background: var(--cartao);
    border: 2px solid var(--linha);
    font-size: 15px;
    color: var(--tinta-suave);
    transition: background .2s, border-color .2s, color .2s;
  }
  .estado .ponto { width: 10px; height: 10px; border-radius: 50%; background: var(--verde); }
  .estado[data-estado="ouvindo"] { background: var(--vermelho-claro); border-color: var(--vermelho); color: var(--vermelho); }
  .estado[data-estado="ouvindo"] .ponto { background: var(--vermelho); animation: pisca 1s ease-in-out infinite; }
  .estado[data-estado="falando"] { background: var(--laranja-claro); border-color: var(--laranja); color: #9a4b07; }
  .estado[data-estado="falando"] .ponto { background: var(--laranja); }
  .estado[data-estado="oracao"] { background: var(--lilas-claro); border-color: var(--lilas); color: var(--lilas); }
  .estado[data-estado="oracao"] .ponto { background: var(--lilas); }
  .estado[data-estado="dica"] { background: var(--amarelo-claro); border-color: #e2b23a; color: var(--amarelo); }
  .estado[data-estado="dica"] .ponto { background: #e2b23a; }
  @keyframes pisca { 50% { opacity: .3; } }

  .balao {
    position: relative;
    width: 100%;
    background: var(--cartao);
    border-radius: 22px;
    padding: 12px 18px;
    font-size: clamp(18px, 4.8vw, 22px);
    font-weight: 800;
    line-height: 1.3;
    min-height: 2.6em;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    text-wrap: balance;
    box-shadow: var(--sombra);
  }
  .balao::after {
    content: "";
    position: absolute;
    left: 50%;
    bottom: -11px;
    transform: translateX(-50%);
    border: 12px solid transparent;
    border-top-color: var(--cartao);
    border-bottom: 0;
  }

  .area-gato { position: relative; flex: 1; min-height: 0; width: 100%; display: flex; justify-content: center; align-items: flex-end; }
  #gato { position: relative; z-index: 1; height: 100%; max-height: 480px; width: auto; max-width: 100%; cursor: pointer; overflow: visible; }
  #gato:focus-visible { outline: none; }
  /* halo atrás do Miguel enquanto ele ouve: cresce com a voz da criança */
  .anel {
    position: absolute;
    z-index: 0;
    left: 50%;
    top: 42%;
    width: 200px; height: 200px;
    margin: -100px 0 0 -100px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(217,61,66,.22) 55%, rgba(217,61,66,0) 70%);
    border: 4px solid rgba(217,61,66,.55);
    opacity: 0;
    pointer-events: none;
    transition: opacity .2s;
  }
  .area-gato.ouvindo-on .anel { opacity: 1; }

  /* animações do Miguel */
  #corpo-todo { transform-origin: 200px 470px; animation: respira 3.2s ease-in-out infinite; }
  @keyframes respira { 50% { transform: scale(1.012, .988); } }
  #rabo { transform-origin: 290px 400px; animation: rabo 2.6s ease-in-out infinite; }
  @keyframes rabo { 50% { transform: rotate(12deg); } }
  .olho-fechado { display: none; }
  #gato.piscando .olho-aberto, #gato.rezando .olho-aberto { display: none; }
  #gato.piscando .olho-fechado, #gato.rezando .olho-fechado { display: inline; }
  #orelha-e { transform-origin: 130px 120px; }
  #orelha-d { transform-origin: 270px 120px; }
  #gato.ouvindo #orelha-e { animation: orelha-e .6s ease-in-out infinite; }
  #gato.ouvindo #orelha-d { animation: orelha-d .6s ease-in-out infinite; }
  @keyframes orelha-e { 50% { transform: rotate(-8deg); } }
  @keyframes orelha-d { 50% { transform: rotate(8deg); } }
  #cabeca { transform-origin: 200px 260px; transition: transform .3s; }
  #gato.ouvindo #cabeca { transform: rotate(-7deg); }
  #gato.falando #cabeca { animation: balanca .7s ease-in-out infinite; }
  #gato.rezando #cabeca { animation: none; transform: rotate(0) translateY(6px); }
  @keyframes balanca { 25% { transform: rotate(-3deg); } 75% { transform: rotate(3deg); } }
  #gato.cutucado #corpo-todo { animation: pulinho .35s ease-out; }
  @keyframes pulinho { 40% { transform: translateY(-14px) scale(1.02, .98); } }
  #mao-orelha { display: none; }
  #gato.ouvindo #mao-orelha { display: inline; }
  #gato.ouvindo #braco-e, #gato.ouvindo .braco-e-in { display: none; }
  #boca-aberta { transform-origin: 200px 262px; transform: scaleY(0); }

  .nota { position: absolute; font-size: 28px; pointer-events: none; animation: sobe 1.6s ease-out forwards; }
  @keyframes sobe {
    from { transform: translateY(0) scale(.6); opacity: 1; }
    to { transform: translateY(-140px) scale(1.15); opacity: 0; }
  }

  /* ações */
  .acoes { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .acao {
    min-height: 60px;
    border-radius: 20px;
    border: 2px solid;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 14px;
    text-align: left;
    box-shadow: var(--sombra);
  }
  .acao .simbolo { font-size: 30px; line-height: 1; }
  .acao strong { display: block; font-size: 19px; font-weight: 900; line-height: 1.1; }
  .acao small { display: block; font-size: 13px; font-weight: 700; opacity: .85; }
  .acao-oracao { background: var(--lilas-claro); border-color: #b9aef0; color: #3f2f9e; }
  .acao-dica { background: var(--amarelo-claro); border-color: #f0cf6a; color: #6b4700; }
  .acao:active, .botao-icone:active, .voz:active { transform: translateY(2px); }

  /* vozes */
  .painel-vozes {
    background: var(--cartao);
    border-radius: 22px;
    padding: 8px 10px 10px;
    box-shadow: var(--sombra);
  }
  .painel-vozes h2 { margin: 0 0 6px 4px; font-size: 15px; font-weight: 800; color: var(--tinta-suave); }
  .vozes { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .voz {
    position: relative;
    min-height: 56px;
    border: 2px solid var(--linha);
    border-radius: 16px;
    background: var(--cartao);
    padding: 6px 2px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 2px;
  }
  .voz .simbolo { font-size: 21px; line-height: 1.1; }
  .voz .nome { font-size: 13px; line-height: 1.1; text-align: center; overflow-wrap: anywhere; }
  .voz[aria-pressed="true"] { border-color: var(--laranja); background: var(--laranja-claro); color: #8a4306; }
  .voz[aria-pressed="true"]::after {
    content: "✓";
    position: absolute;
    top: -8px; right: -6px;
    width: 22px; height: 22px;
    border-radius: 50%;
    background: var(--laranja);
    color: #fff;
    font-size: 13px;
    line-height: 22px;
    text-align: center;
  }
  .vozes.destaque .voz { animation: chama .5s ease-in-out 4; }
  @keyframes chama { 50% { transform: translateY(-6px); } }

  footer { text-align: center; font-size: 12px; font-weight: 800; letter-spacing: .12em; color: #2d5a1f; opacity: .8; }

  /* aviso de instalar */
  #instalar {
    position: fixed;
    top: calc(8px + env(safe-area-inset-top, 0px));
    left: 50%;
    transform: translateX(-50%);
    width: min(528px, calc(100% - 24px));
    z-index: 30;
    background: var(--cartao);
    border: 2px solid var(--linha);
    border-radius: 20px;
    padding: 10px 10px 10px 14px;
    box-shadow: var(--sombra);
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 8px;
  }
  #instalar[hidden] { display: none; }
  #instalar .texto { flex: 1 1 150px; min-width: 0; font-size: 16px; }
  #instalar button { border: 0; border-radius: 14px; min-height: 44px; padding: 0 16px; }
  #instalar-sim { background: var(--laranja); color: #fff; font-weight: 900; }
  #instalar-nao { background: transparent; font-size: 20px; min-width: 44px; }
  #instalar-dica { flex-basis: 100%; margin: 0; font-size: 15px; color: var(--tinta-suave); }

  /* boas-vindas */
  #boas-vindas {
    position: fixed;
    inset: 0;
    z-index: 20;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
    background: rgba(31, 45, 61, .45);
  }
  #boas-vindas[hidden] { display: none; }
  .cartao-boas-vindas {
    width: min(420px, 100%);
    background: var(--cartao);
    border-radius: 28px;
    padding: 22px 20px 20px;
    text-align: center;
    box-shadow: var(--sombra);
  }
  .cartao-boas-vindas img { width: 84px; height: 84px; border-radius: 24px; }
  .cartao-boas-vindas h2 { margin: 8px 0 14px; font-size: 24px; font-weight: 900; text-wrap: balance; }
  .passos { list-style: none; margin: 0 0 18px; padding: 0; display: grid; gap: 8px; text-align: left; }
  .passos li { display: flex; align-items: center; gap: 12px; background: var(--ceu-claro); border-radius: 16px; padding: 10px 12px; font-size: 17px; }
  .passos .simbolo { font-size: 26px; width: 34px; text-align: center; }
  #comecar {
    width: 100%;
    min-height: 60px;
    border: 0;
    border-radius: 18px;
    background: var(--laranja);
    color: #fff;
    font-size: 22px;
    font-weight: 900;
    box-shadow: 0 4px 0 #b85a0c;
  }

  /* modo calmo: sem movimentos extras */
  .calmo #corpo-todo, .calmo #rabo, .calmo #gato.falando #cabeca,
  .calmo #gato.ouvindo #orelha-e, .calmo #gato.ouvindo #orelha-d,
  .calmo #gato.cutucado #corpo-todo, .calmo .vozes.destaque .voz,
  .calmo .estado[data-estado="ouvindo"] .ponto { animation: none; }
  .calmo .nota { display: none; }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
    .nota { display: none; }
  }

  @media (max-height: 640px) {
    .marca img { width: 36px; height: 36px; }
    .botao-icone { height: 48px; min-width: 50px; }
    .acao { min-height: 54px; }
    .voz { min-height: 54px; }
    .voz .simbolo { font-size: 20px; }
  }
</style>
</head>
<body>
<div class="app">
  <header class="topo">
    <div class="marca">
      <img src="icones/icone-192.png" alt="" width="44" height="44">
      <div><strong>Miguel</strong><span>o gato falante</span></div>
    </div>
    <div class="topo-botoes">
      <button id="calmo" class="botao-icone" aria-pressed="false" aria-label="Modo calmo: menos movimento e fala mais devagar">
        <span class="simbolo" aria-hidden="true">🌙</span><span class="rotulo">Calmo</span>
      </button>
      <button id="ajuda" class="botao-icone" aria-label="Miguel explica como brincar">
        <span class="simbolo" aria-hidden="true">❓</span><span class="rotulo">Ajuda</span>
      </button>
    </div>
  </header>

  <main id="palco">
    <div id="estado" class="estado" data-estado="parado"><span class="ponto" aria-hidden="true"></span><span id="estado-texto">Toque no Miguel para falar</span></div>
    <div class="balao" id="balao" aria-live="polite">Oi! Eu sou o Miguel. Toque em mim e fale!</div>
    <div class="area-gato" id="area-gato">
      <div class="anel" id="anel"></div>
      <svg id="gato" viewBox="0 0 400 500" role="button" tabindex="0" aria-label="Miguel, o gato: toque para falar">
        <g id="corpo-todo">
          <!-- sombra -->
          <ellipse cx="200" cy="482" rx="130" ry="14" fill="rgba(0,0,0,.15)"/>
          <!-- rabo -->
          <path id="rabo" d="M285 420 C 360 410, 380 330, 340 290 C 330 280, 318 292, 326 302 C 352 336, 336 390, 280 395 Z"
                fill="var(--pelo)" stroke="var(--pelo-escuro)" stroke-width="4" stroke-linejoin="round"/>
          <!-- corpo -->
          <path d="M110 480 C 95 400, 120 330, 200 325 C 280 330, 305 400, 290 480 Z"
                fill="var(--pelo)" stroke="var(--pelo-escuro)" stroke-width="4"/>
          <path d="M150 478 C 145 420, 165 375, 200 372 C 235 375, 255 420, 250 478 Z" fill="var(--creme)"/>
          <!-- patas -->
          <ellipse cx="160" cy="476" rx="30" ry="16" fill="var(--creme)" stroke="var(--pelo-escuro)" stroke-width="4"/>
          <ellipse cx="240" cy="476" rx="30" ry="16" fill="var(--creme)" stroke="var(--pelo-escuro)" stroke-width="4"/>
          <!-- braços -->
          <path id="braco-e" d="M128 360 C 110 400, 120 440, 150 450" fill="none" stroke="var(--pelo-escuro)" stroke-width="26" stroke-linecap="round"/>
          <path d="M128 360 C 110 400, 120 440, 150 450" fill="none" stroke="var(--pelo)" stroke-width="18" stroke-linecap="round" class="braco-e-in"/>
          <path d="M272 360 C 290 400, 280 440, 250 450" fill="none" stroke="var(--pelo-escuro)" stroke-width="26" stroke-linecap="round"/>
          <path d="M272 360 C 290 400, 280 440, 250 450" fill="none" stroke="var(--pelo)" stroke-width="18" stroke-linecap="round"/>

          <g id="cabeca">
            <!-- orelhas -->
            <g id="orelha-e">
              <path d="M95 175 L 105 55 L 190 120 Z" fill="var(--pelo)" stroke="var(--pelo-escuro)" stroke-width="5" stroke-linejoin="round"/>
              <path d="M115 150 L 120 85 L 168 122 Z" fill="#ffb3c1"/>
            </g>
            <g id="orelha-d">
              <path d="M305 175 L 295 55 L 210 120 Z" fill="var(--pelo)" stroke="var(--pelo-escuro)" stroke-width="5" stroke-linejoin="round"/>
              <path d="M285 150 L 280 85 L 232 122 Z" fill="#ffb3c1"/>
            </g>
            <!-- cabeça -->
            <ellipse cx="200" cy="215" rx="125" ry="105" fill="var(--pelo)" stroke="var(--pelo-escuro)" stroke-width="5"/>
            <!-- listras -->
            <path d="M200 112 L 200 150 M178 115 L 182 145 M222 115 L 218 145" stroke="var(--pelo-escuro)" stroke-width="7" stroke-linecap="round"/>
            <!-- focinho -->
            <ellipse cx="200" cy="255" rx="62" ry="45" fill="var(--creme)"/>
            <!-- bochechas -->
            <ellipse cx="118" cy="250" rx="18" ry="11" fill="#ff9aae" opacity=".6"/>
            <ellipse cx="282" cy="250" rx="18" ry="11" fill="#ff9aae" opacity=".6"/>

            <!-- olhos abertos -->
            <g class="olho-aberto">
              <ellipse cx="155" cy="200" rx="26" ry="32" fill="#fff" stroke="#3a2a1a" stroke-width="4"/>
              <ellipse cx="245" cy="200" rx="26" ry="32" fill="#fff" stroke="#3a2a1a" stroke-width="4"/>
              <g id="pupilas">
                <ellipse cx="160" cy="205" rx="14" ry="19" fill="#4a8c2a"/>
                <ellipse cx="240" cy="205" rx="14" ry="19" fill="#4a8c2a"/>
                <ellipse cx="160" cy="207" rx="7" ry="13" fill="#1a1a1a"/>
                <ellipse cx="240" cy="207" rx="7" ry="13" fill="#1a1a1a"/>
                <circle cx="164" cy="197" r="5" fill="#fff"/>
                <circle cx="244" cy="197" r="5" fill="#fff"/>
              </g>
            </g>
            <!-- olhos fechados (piscar) -->
            <g class="olho-fechado" fill="none" stroke="#3a2a1a" stroke-width="5" stroke-linecap="round">
              <path d="M132 205 Q 155 222 178 205"/>
              <path d="M222 205 Q 245 222 268 205"/>
            </g>

            <!-- nariz -->
            <path d="M188 236 L 212 236 L 200 250 Z" fill="#ff6b8b" stroke="#c94a68" stroke-width="3" stroke-linejoin="round"/>
            <!-- boca fechada -->
            <path id="boca-fechada" d="M200 250 L 200 262 M200 262 Q 188 276 176 264 M200 262 Q 212 276 224 264"
                  fill="none" stroke="#3a2a1a" stroke-width="4" stroke-linecap="round"/>
            <!-- boca aberta -->
            <g id="boca-aberta">
              <ellipse cx="200" cy="278" rx="26" ry="22" fill="#7a1f2b" stroke="#3a2a1a" stroke-width="4"/>
              <ellipse cx="200" cy="290" rx="15" ry="8" fill="#ff7b93"/>
            </g>
            <!-- bigodes -->
            <g stroke="#3a2a1a" stroke-width="3" stroke-linecap="round">
              <path d="M140 255 L 70 240"/><path d="M140 265 L 68 268"/><path d="M142 275 L 76 295"/>
              <path d="M260 255 L 330 240"/><path d="M260 265 L 332 268"/><path d="M258 275 L 324 295"/>
            </g>
          </g>

          <!-- mão na orelha (quando está ouvindo) -->
          <g id="mao-orelha">
            <path d="M128 360 C 70 320, 70 230, 92 175" fill="none" stroke="var(--pelo-escuro)" stroke-width="26" stroke-linecap="round"/>
            <path d="M128 360 C 70 320, 70 230, 92 175" fill="none" stroke="var(--pelo)" stroke-width="18" stroke-linecap="round"/>
            <ellipse cx="92" cy="172" rx="20" ry="17" fill="var(--creme)" stroke="var(--pelo-escuro)" stroke-width="4"/>
          </g>
        </g>
      </svg>
    </div>
  </main>

  <div class="acoes">
    <button id="orar" class="acao acao-oracao">
      <span class="simbolo" aria-hidden="true">🙏</span>
      <span><strong>Oração</strong><small id="orar-quando">uma de cada vez</small></span>
    </button>
    <button id="dicas" class="acao acao-dica">

      <button class="voz" data-voz="dani" aria-pressed="false"><span class="simbolo" aria-hidden="true">🐿️</span><span class="nome">Tia Dani</span></button>
      <button class="voz" data-voz="bob" aria-pressed="false"><span class="simbolo" aria-hidden="true">🧽</span><span class="nome">Bob Esponja</span></button>
      <button class="voz" data-voz="pirata" aria-pressed="false"><span class="simbolo" aria-hidden="true">🏴‍☠️</span><span class="nome">Pirata</span></button>
      <button class="voz" data-voz="gatinho" aria-pressed="false"><span class="simbolo" aria-hidden="true">🐱</span><span class="nome">Gatinho</span></button>
      <button class="voz" data-voz="monstro" aria-pressed="false"><span class="simbolo" aria-hidden="true">👹</span><span class="nome">Monstro</span></button>
      <button class="voz" data-voz="robo" aria-pressed="false"><span class="simbolo" aria-hidden="true">🤖</span><span class="nome">Robô</span></button>

<div id="boas-vindas" hidden>
  <div class="cartao-boas-vindas" role="dialog" aria-labelledby="boas-vindas-titulo">
    <img src="icones/icone-192.png" alt="">
    <h2 id="boas-vindas-titulo">O Miguel quer te conhecer!</h2>
    <ol class="passos">
      <li><span class="simbolo" aria-hidden="true">👆</span>Toque no Miguel</li>
      <li><span class="simbolo" aria-hidden="true">🗣️</span>Fale alguma coisa</li>
      <li><span class="simbolo" aria-hidden="true">😹</span>Ele repete com voz engraçada</li>
    </ol>
    <button id="comecar">▶ Começar</button>
  </div>
</div>

<script>
(() => {
  const gato = document.getElementById('gato');
  const balao = document.getElementById('balao');
  const areaGato = document.getElementById('area-gato');
  const anel = document.getElementById('anel');
  const caixaEstado = document.getElementById('estado');
  const textoEstado = document.getElementById('estado-texto');
  const bocaAberta = document.getElementById('boca-aberta');
  const bocaFechada = document.getElementById('boca-fechada');
  const vozesBarra = document.getElementById('vozes');
  const boasVindas = document.getElementById('boas-vindas');

  const guardar = (chave, valor) => { try { localStorage.setItem(chave, valor); } catch (e) {} };
  const ler = (chave) => { try { return localStorage.getItem(chave); } catch (e) { return null; } };

  // Vozes: velocidade de reprodução (muda o tom) e efeitos opcionais
  //   ritmo: velocidade final da fala; com ele o tom sobe sem a fala ficar corrida demais
  //   tom: sobe só a altura da voz, mantendo o "jeito" de quem falou (antes de acelerar)
  //   tremido: voz tremendo   nasal: voz pelo nariz   rouco: voz arranhada
  //   eco: repete no fundo    brilho: mais agudos      fina: corta os graves
  //   robo: voz metálica      forte: volume mais firme
  const VOZES = {
    esquilo: { velocidade: 1.6 },
    dani:    { velocidade: 2.5, ritmo: 1.3, fina: true, brilho: true, frases: ['Hihihi! Oi, eu sou a tia Dani! 🐿️', 'Tia Dani na área! 🐿️'] },
    bob:     { velocidade: 1.2, tom: 1.5, nasal: true, forte: true, frases: ['Estou pronto! Estou pronto! 🧽', 'Ahahahaha! 🧽'] },
    pirata:  { velocidade: 0.82, rouco: true, eco: true, tremido: { hz: 3, forca: 0.03 }, frases: ['Arrr, marujo! 🏴‍☠️', 'Ahoy! Ao mar! ☠️'] },
    gatinho: { velocidade: 1.35 },
    monstro: { velocidade: 0.7 },
    robo:    { velocidade: 1.1, robo: true },
  };
  let vozAtual = 'esquilo';

  // Detecção de fala
  const LIMIAR_FALA = 0.03;      // volume que conta como fala
  const SILENCIO_FIM = 1100;     // ms de silêncio depois de falar para parar
  const ESPERA_MAX = 6000;       // ms esperando a criança começar a falar
  const GRAVACAO_MAX = 10000;    // ms de gravação no máximo

  let ctx = null, microfone = null, processador = null;
  let estado = 'parado'; // parado | narrando | ouvindo | falando
  let tipoNarracao = 'ajuda'; // ajuda | oracao | dica
  let pedacos = [], inicioGravacao = 0, comecouFalar = false, ultimoSom = 0, indiceInicioFala = 0;
  let calmo = false;

  const ESTADOS = {
    parado:  ['parado', 'Toque no Miguel para falar'],
    ouvindo: ['ouvindo', 'Ouvindo... pode falar'],
    falando: ['falando', 'Miguel está repetindo'],
    ajuda:   ['falando', 'Miguel está explicando'],
    oracao:  ['oracao', 'Hora da oração'],
    dica:    ['dica', 'Dica do Miguel'],
  };

  function falar(texto) {
    balao.textContent = texto;
  }

  function setEstado(novo) {
    estado = novo;
    gato.classList.toggle('ouvindo', novo === 'ouvindo');
    gato.classList.toggle('falando', novo === 'falando' || novo === 'narrando');
    areaGato.classList.toggle('ouvindo-on', novo === 'ouvindo');
    if (novo !== 'falando') abrirBoca(0);
    if (novo !== 'ouvindo') anel.style.transform = 'scale(1)';
    const [tipo, texto] = ESTADOS[novo === 'narrando' ? tipoNarracao : novo];
    caixaEstado.dataset.estado = tipo;
    textoEstado.textContent = texto;
  }

  function abrirBoca(n) {
    n = Math.max(0, Math.min(1, n));
    bocaAberta.style.transform = `scaleY(${n})`;
    bocaFechada.style.opacity = n > 0.15 ? 0 : 1;
  }

  async function prepararAudio() {
    if (ctx) {
      if (ctx.state === 'suspended') await ctx.resume();
      return;
    }
    const Ctx = window.AudioContext || window.webkitAudioContext;
    ctx = new Ctx();
    const stream = await navigator.mediaDevices.getUserMedia({
      audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true },
    });
    microfone = ctx.createMediaStreamSource(stream);
    processador = ctx.createScriptProcessor(2048, 1, 1);
    processador.onaudioprocess = aoReceberAudio;
    const mudo = ctx.createGain();
    mudo.gain.value = 0;
    microfone.connect(processador);
    processador.connect(mudo);
    mudo.connect(ctx.destination);
  }

  function aoReceberAudio(e) {
    if (estado !== 'ouvindo') return;
    const dados = new Float32Array(e.inputBuffer.getChannelData(0));
    pedacos.push(dados);

    let soma = 0;
    for (let i = 0; i < dados.length; i++) soma += dados[i] * dados[i];
    const volume = Math.sqrt(soma / dados.length);
    anel.style.transform = `scale(${1 + Math.min(volume * 6, 0.35)})`;

    const agora = performance.now();
    if (volume > LIMIAR_FALA) {
      if (!comecouFalar) {
        comecouFalar = true;
        // guarda um pouquinho do áudio antes da fala começar
        indiceInicioFala = Math.max(0, pedacos.length - 4);
      }
      ultimoSom = agora;
    }

    if (comecouFalar && agora - ultimoSom > SILENCIO_FIM) pararDeOuvir();
    else if (!comecouFalar && agora - inicioGravacao > ESPERA_MAX) {
      setEstado('parado');
      falar('Não ouvi nada... Toque em mim e fale mais alto!');
    } else if (agora - inicioGravacao > GRAVACAO_MAX) pararDeOuvir();
  }

  async function comecarAOuvir() {
    try {
      await prepararAudio();
    } catch (err) {
      console.error(err);
      falar('Preciso do microfone! Permita o acesso e toque de novo.');
      ctx = null;
      return;
    }
    pedacos = [];
    comecouFalar = false;
    indiceInicioFala = 0;
    inicioGravacao = performance.now();
    setEstado('ouvindo');
    falar('Estou ouvindo... 👂');
  }

  function pararDeOuvir() {
    if (estado !== 'ouvindo') return;
    if (!comecouFalar) {
      setEstado('parado');
      falar('Não ouvi nada... Toque em mim e fale!');
      return;
    }
    // corta o silêncio do fim (mantém ~0,25 s)
    const tamPedaco = pedacos[0].length;
    const sobraFinal = Math.ceil((SILENCIO_FIM / 1000) * ctx.sampleRate / tamPedaco) - 3;
    const fim = Math.max(indiceInicioFala + 1, pedacos.length - Math.max(0, sobraFinal));
    const usados = pedacos.slice(indiceInicioFala, fim);
    repetir(usados);
  }

  function repetir(lista) {
    const voz = VOZES[vozAtual];
    const total = lista.reduce((n, p) => n + p.length, 0);
    let dados = new Float32Array(total);
    let pos = 0, pico = 0;
    for (const p of lista) { dados.set(p, pos); pos += p.length; }
    for (let i = 0; i < total; i++) pico = Math.max(pico, Math.abs(dados[i]));
    // deixa a voz bem audível (um pouco mais baixa no modo calmo)
    const ganho = pico > 0 ? Math.min((calmo ? 0.7 : 0.95) / pico, 8) : 1;
    for (let i = 0; i < total; i++) dados[i] *= ganho;
    if (voz.tom) dados = mudarTom(dados, voz.tom, ctx.sampleRate);
    if (voz.ritmo) dados = esticar(dados, voz.velocidade / voz.ritmo);

    const buffer = ctx.createBuffer(1, dados.length, ctx.sampleRate);
    buffer.getChannelData(0).set(dados);
    const fonte = ctx.createBufferSource();
    fonte.buffer = buffer;
    fonte.playbackRate.value = voz.velocidade;

    const analisador = ctx.createAnalyser();
    analisador.fftSize = 512;
    let saida = fonte;
    const osciladores = [];
    const ligar = (no) => { saida.connect(no); saida = no; };
    const filtro = (tipo, freq, q, ganhoDb) => {
      const f = ctx.createBiquadFilter();
      f.type = tipo;
      f.frequency.value = freq;
      if (q) f.Q.value = q;
      if (ganhoDb) f.gain.value = ganhoDb;
      ligar(f);
    };

    if (voz.tremido) {
      const lfo = ctx.createOscillator();
      const forca = ctx.createGain();
      lfo.frequency.value = voz.tremido.hz;
      forca.gain.value = voz.velocidade * voz.tremido.forca;
      lfo.connect(forca);
      forca.connect(fonte.playbackRate);
      osciladores.push(lfo);
    }
    if (voz.robo) {
      const modulador = ctx.createGain();
      modulador.gain.value = 0;
      const osc = ctx.createOscillator();
      osc.type = 'square';
      osc.frequency.value = 60;
      osc.connect(modulador.gain);
      osciladores.push(osc);
      ligar(modulador);
    }
    if (voz.nasal) {
      // voz "pelo nariz": tira o grave do peito e reforça a ressonância nasal
      filtro('highpass', 380, 0.9);
      filtro('peaking', 900, 2.5, 10);
      filtro('peaking', 2400, 3, 6);
      filtro('peaking', 280, 1, -6);
      filtro('lowpass', 6000, 0.7);
    }
    if (voz.fina) filtro('highpass', 700, 0.7);
    if (voz.brilho) filtro('highshelf', 3500, 0, 6);
    if (voz.rouco) {
      const arranhado = ctx.createWaveShaper();
      arranhado.curve = curvaRouca(25);
      arranhado.oversample = '4x';
      ligar(arranhado);
      filtro('lowpass', 2800);
      const volume = ctx.createGain();
      volume.gain.value = 0.6;
      ligar(volume);
    }
    if (voz.forte) {
      const compressor = ctx.createDynamicsCompressor();
      compressor.threshold.value = -28;
      compressor.ratio.value = 6;
      ligar(compressor);
    }
    if (voz.eco) {
      const atraso = ctx.createDelay(1);
      const volta = ctx.createGain();
      atraso.delayTime.value = 0.22;
      volta.gain.value = 0.35;
      saida.connect(atraso);
      atraso.connect(volta);
      volta.connect(atraso);
      volta.connect(analisador);
    }
    for (const osc of osciladores) osc.start();
    saida.connect(analisador);
    analisador.connect(ctx.destination);

    setEstado('falando');
    const frases = voz.frases || ['Hihihi! 😹', 'Olha eu falando! 😸', 'Miau! 🎶', 'Eu sou o Miguel! 😺'];
    falar(frases[Math.floor(Math.random() * frases.length)]);

    const amostras = new Float32Array(analisador.fftSize);
    let animando = true;
    let ultimaNota = 0;
    (function animar(t) {
      if (!animando) return;
      analisador.getFloatTimeDomainData(amostras);
      let soma = 0;
      for (let i = 0; i < amostras.length; i++) soma += amostras[i] * amostras[i];
      const vol = Math.sqrt(soma / amostras.length);
      abrirBoca(vol * 4.5);
      if (vol > 0.08 && t - ultimaNota > 400) { soltarNota(); ultimaNota = t; }
      requestAnimationFrame(animar);
    })(0);

    fonte.onended = () => {
      animando = false;
      for (const osc of osciladores) osc.stop();
      setEstado('parado');
      falar('Fala mais comigo! Toque no Miguel! 😺');
    };
    fonte.start();
  }

  // Estica a fala sem mudar o tom (WSOLA): junta pedacinhos do som que se encaixam
  function esticar(x, fator) {
    const N = 1024, saidaPasso = N / 2, entradaPasso = saidaPasso / fator, busca = 256;
    if (x.length < N * 2) return x;
    const janela = new Float32Array(N);
    for (let i = 0; i < N; i++) janela[i] = 0.5 - 0.5 * Math.cos((2 * Math.PI * i) / N);
    const y = new Float32Array(Math.ceil(x.length * fator) + N);
    const peso = new Float32Array(y.length);
    let anterior = 0, fim = 0;
    for (let k = 0; ; k++) {
      const ideal = Math.round(k * entradaPasso);
      if (ideal + N >= x.length || k * saidaPasso + N > y.length) break;
      let escolhido = ideal;
      if (k > 0) {
        const natural = anterior + saidaPasso;
        let melhor = -Infinity;
        const de = Math.max(0, ideal - busca), ate = Math.min(x.length - N - 1, ideal + busca);
        for (let p = de; p <= ate; p += 2) {
          let c = 0;
          for (let j = 0; j < saidaPasso; j += 4) c += x[p + j] * x[natural + j];
          if (c > melhor) { melhor = c; escolhido = p; }
        }
      }
      const o = k * saidaPasso;
      for (let j = 0; j < N; j++) {
        y[o + j] += x[escolhido + j] * janela[j];
        peso[o + j] += janela[j];
      }
      anterior = escolhido;
      fim = o + N;
    }
    for (let i = 0; i < fim; i++) if (peso[i] > 0.05) y[i] /= peso[i];
    return y.subarray(0, fim);
  }

  // Muda o tom sem mudar a duração nem o "jeito" da voz (PSOLA simplificado):
  // acha o tamanho de cada vibração da voz e junta pedacinhos mais perto um do outro
  function mudarTom(x, fator, taxa) {
    const passo = Math.round(taxa * 0.01);
    const d = 4, taxaD = taxa / d;
    const xd = new Float32Array(Math.floor(x.length / d));
    for (let i = 0; i < xd.length; i++) xd[i] = x[i * d];
    const menor = Math.floor(taxaD / 450), maior = Math.ceil(taxaD / 70), janelaD = maior * 2;
    const quadros = Math.ceil(x.length / passo);
    const periodo = new Float32Array(quadros);
    for (let q = 0; q < quadros; q++) {
      const ini = Math.round((q * passo) / d) - maior;
      if (ini < 0 || ini + janelaD + maior >= xd.length) continue;
      let e0 = 0;
      for (let j = 0; j < janelaD; j++) e0 += xd[ini + j] * xd[ini + j];
      if (e0 / janelaD < 2e-4) continue;
      let melhor = 0, atraso = 0;
      for (let lag = menor; lag <= maior; lag++) {
        let c = 0, e1 = 0;
        for (let j = 0; j < janelaD; j++) {
          const b = xd[ini + j + lag];
          c += xd[ini + j] * b;
          e1 += b * b;
        }
        const r = c / Math.sqrt(e0 * e1 + 1e-9);
        if (r > melhor) { melhor = r; atraso = lag; }
      }
      if (melhor > 0.55) periodo[q] = atraso * d;
    }

    const marcas = [];
    for (let t = 0; t < x.length;) {
      const T = periodo[Math.min(quadros - 1, Math.floor(t / passo))];
      marcas.push({ t, T: T || passo, voz: T > 0 });
      t += T || passo;
    }

    const y = new Float32Array(x.length);
    const peso = new Float32Array(x.length);
    let k = 0;
    for (let s = 0; s < x.length;) {
      while (k + 1 < marcas.length && marcas[k + 1].t <= s) k++;
      const m = marcas[k];
      const T = Math.round(m.T);
      for (let j = -T; j < T; j++) {
        const origem = m.t + j, destino = s + j;
        if (origem < 0 || origem >= x.length || destino < 0 || destino >= y.length) continue;
        const w = 0.5 + 0.5 * Math.cos((Math.PI * j) / T);
        y[destino] += x[origem] * w;
        peso[destino] += w;
      }
      s += m.voz ? Math.max(1, Math.round(T / fator)) : T;
    }
    for (let i = 0; i < y.length; i++) if (peso[i] > 0.1) y[i] /= peso[i];
    return y;
  }

  function curvaRouca(k) {
    const n = 1024, curva = new Float32Array(n);
    for (let i = 0; i < n; i++) {
      const x = (i * 2) / n - 1;
      curva[i] = ((1 + k) * x) / (1 + k * Math.abs(x));
    }
    return curva;
  }

  function soltarNota() {
    if (calmo) return;
    const n = document.createElement('div');
    n.className = 'nota';
    n.textContent = ['🎵', '🎶', '💛', '⭐'][Math.floor(Math.random() * 4)];
    const r = areaGato.getBoundingClientRect();
    n.style.left = (r.width / 2 + (Math.random() * 160 - 80)) + 'px';
    n.style.top = (r.height * 0.3) + 'px';
    areaGato.appendChild(n);
    setTimeout(() => n.remove(), 1700);
  }

  function aoTocarGato(e) {
    e.preventDefault();
    gato.classList.remove('cutucado');
    void gato.getBoundingClientRect();
    gato.classList.add('cutucado');
    if (estado === 'narrando') {
      pararNarracao();
      comecarAOuvir();
    } else if (estado === 'parado') comecarAOuvir();
    else if (estado === 'ouvindo') pararDeOuvir();
  }
  gato.addEventListener('pointerdown', aoTocarGato);
  gato.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') aoTocarGato(e); });

  vozesBarra.addEventListener('click', (e) => {
    const b = e.target.closest('.voz');
    if (!b) return;
    vozAtual = b.dataset.voz;
    for (const outro of vozesBarra.querySelectorAll('.voz')) {
      outro.setAttribute('aria-pressed', String(outro === b));
    }
    guardar('miguel-voz', vozAtual);
    if (estado === 'parado') falar('Voz ' + b.querySelector('.nome').textContent + '! Toque em mim e fale.');
  });

  // piscar de vez em quando
  (function piscar() {
    setTimeout(() => {
      if (estado !== 'falando') {
        gato.classList.add('piscando');
        setTimeout(() => gato.classList.remove('piscando'), 160);
      }
      piscar();
    }, 2500 + Math.random() * 3000);
  })();

  // ---------- Falas do Miguel (voz do aparelho) ----------
  let narracaoId = 0, mexendoBoca = null;

  function vozPortugues() {
    if (!('speechSynthesis' in window)) return null;
    const lista = speechSynthesis.getVoices();
    return lista.find(v => v.lang === 'pt-BR') || lista.find(v => v.lang.startsWith('pt')) || null;
  }

  function narrar(texto, pronto, jeito) {
    const inicio = performance.now();
    const minimo = 800 + texto.length * 45;
    let acabou = false;
    clearInterval(mexendoBoca);
    const boca = setInterval(() => abrirBoca(0.25 + Math.random() * 0.75), 110);
    mexendoBoca = boca;
    const fim = () => {
      if (acabou) return;
      acabou = true;
      // se a voz do aparelho falhar, ainda dá tempo de ler o balão
      setTimeout(() => {
        clearInterval(boca);
        if (mexendoBoca === boca) abrirBoca(0);
        pronto();
      }, Math.max(0, minimo - (performance.now() - inicio)));
    };
    if ('speechSynthesis' in window) {
      const u = new SpeechSynthesisUtterance(texto.replace(/[^\p{L}\p{N}\s,.!?:]/gu, ''));
      u.lang = 'pt-BR';
      u.pitch = jeito.tom;
      u.rate = jeito.ritmo * (calmo ? 0.85 : 1);
      u.volume = calmo ? 0.8 : 1;
      const voz = vozPortugues();
      if (voz) u.voice = voz;
      u.onend = fim;
      u.onerror = fim;
      speechSynthesis.cancel();
      speechSynthesis.speak(u);
      setTimeout(fim, minimo * 3);
    } else {
      fim();
    }
  }

  // Fala uma lista de frases, uma de cada vez, mostrando cada uma no balão
  function narrarSequencia(tipo, frases, jeito, pausa) {
    const id = ++narracaoId;
    tipoNarracao = tipo;
    gato.classList.toggle('rezando', tipo === 'oracao');
    setEstado('narrando');
    let i = 0;
    const proxima = () => {
      if (id !== narracaoId) return;
      if (i >= frases.length) {
        terminarNarracao();
        return;
      }
      const frase = frases[i++];
      falar(frase.texto);
      vozesBarra.classList.toggle('destaque', !!frase.vozes);
      narrar(frase.falado || frase.texto, () => setTimeout(proxima, pausa * (calmo ? 1.5 : 1)), jeito);
    };
    proxima();
  }

  function terminarNarracao() {
    vozesBarra.classList.remove('destaque');
    gato.classList.remove('rezando');
    setEstado('parado');
  }

  function pararNarracao() {
    narracaoId++;
    clearInterval(mexendoBoca);
    if ('speechSynthesis' in window) speechSynthesis.cancel();
    terminarNarracao();
  }

  const VOZ_MIGUEL = { tom: 1.9, ritmo: 1.0 };
  const VOZ_CRIANCA = { tom: 1.7, ritmo: 0.9 };

  // ---------- Horário ----------
  function periodoDoDia(agora = new Date()) {
    const h = agora.getHours();
    if (h >= 5 && h < 12) return 'manha';
    if (h >= 12 && h < 18) return 'tarde';
    return 'noite';
  }
  function horaDeComer(agora = new Date()) {
    const m = agora.getHours() * 60 + agora.getMinutes();
    return (m >= 6 * 60 && m < 9 * 60) || (m >= 11 * 60 && m < 14 * 60) || (m >= 18 * 60 && m < 21 * 60);
  }
  const SAUDACAO = { manha: 'Bom dia', tarde: 'Boa tarde', noite: 'Boa noite' };
  const hoje = () => new Date().toDateString();

  // ---------- Apresentação ----------
  function apresentar() {
    guardar('miguel-apresentou', '1');
    narrarSequencia('ajuda', [
      { texto: SAUDACAO[periodoDoDia()] + '! Eu sou o Miguel, o gato falante! 😺' },
      { texto: 'Toque em mim e fale alguma coisa. 👆' },
      { texto: 'Quando você parar de falar, eu repito com uma voz engraçada! 😹' },
      { texto: 'Aqui embaixo você escolhe a minha voz. Tem tia Dani, Bob Esponja, pirata e muito mais! 👇', vozes: true },
      { texto: 'No botão Oração, eu rezo com você. 🙏' },
      { texto: 'No botão Dicas, eu te ensino coisas legais. 💡' },
      { texto: 'Vamos brincar? Toque em mim! 🐾' },
    ], VOZ_MIGUEL, 350);
  }

  // ---------- Orações (de acordo com o horário) ----------
  // quando: manha | noite | refeicao (só nesses horários) ou sempre
  const ORACOES = [
    { quando: 'manha', titulo: 'Oração da manhã', frases: ['Bom dia, Papai do Céu!', 'Obrigado por este dia novinho.', 'Cuida de mim e da minha família.', 'Me ajuda a tratar todo mundo com carinho.', 'Amém!'] },
    { quando: 'manha', titulo: 'Oração para começar o dia', frases: ['Jesus, eu acordei feliz porque o Senhor está comigo.', 'Abençoa os meus passos hoje.', 'Que eu aprenda, brinque e ajude quem precisar.', 'Amém!'] },
    { quando: 'noite', titulo: 'Oração antes de dormir', frases: ['Papai do Céu, obrigado pelo meu dia.', 'Agora eu vou dormir em paz.', 'Guarda o meu sono e me dá sonhos bonitos.', 'Abençoa a minha família.', 'Amém!'] },
    { quando: 'noite', titulo: 'Oração da noite', frases: ['Jesus, a noite chegou e eu estou protegido.', 'Obrigado por tudo de bom que aconteceu hoje.', 'Me desculpa se eu fiz alguma coisa errada.', 'Cuida de todos que eu amo enquanto a gente dorme.', 'Amém!'] },
    { quando: 'refeicao', titulo: 'Oração antes de comer', frases: ['Obrigado, Senhor, por esta comida gostosa.', 'Abençoa quem preparou com tanto carinho.', 'E dá comida para quem tem fome.', 'Amém!'] },
    { quando: 'sempre', titulo: 'Santo Anjo', frases: ['Santo Anjo do Senhor, meu zeloso guardador,', 'se a ti me confiou a piedade divina,', 'sempre me rege, me guarda, me governa e me ilumina.', 'Amém!'] },
    { quando: 'sempre', titulo: 'Pai Nosso', frases: ['Pai nosso, que estais nos céus, santificado seja o vosso nome.', 'Venha a nós o vosso reino, seja feita a vossa vontade, assim na terra como no céu.', 'O pão nosso de cada dia nos dai hoje.', 'Perdoai as nossas ofensas, assim como nós perdoamos a quem nos tem ofendido.', 'E não nos deixeis cair em tentação, mas livrai-nos do mal.', 'Amém!'] },
    { quando: 'sempre', titulo: 'Oração pela família', frases: ['Jesus, obrigado pela minha família.', 'Abençoa cada pessoa da minha casa.', 'Que a gente se ame e se ajude todos os dias.', 'Amém!'] },
    { quando: 'sempre', titulo: 'Oração pelos amigos', frases: ['Senhor Jesus, obrigado pelos meus amigos.', 'Me ajuda a dividir os brinquedos e a ser um bom amigo.', 'Protege todos eles onde estiverem.', 'Amém!'] },
    { quando: 'sempre', titulo: 'Oração pela escola', frases: ['Papai do Céu, abençoa a minha escola.', 'Me ajuda a aprender coisas novas e a prestar atenção.', 'Abençoa a minha professora e os meus colegas.', 'Amém!'] },
    { quando: 'sempre', titulo: 'Oração pelos bichinhos', frases: ['Deus, obrigado pelos bichinhos que o Senhor criou.', 'Pelos gatinhos, cachorrinhos, passarinhos e peixinhos.', 'Me ensina a cuidar bem de todos eles.', 'Amém!'] },
    { quando: 'sempre', titulo: 'Oração pela natureza', frases: ['Obrigado, Senhor, pelo sol, pela chuva e pelas flores.', 'Tudo o que o Senhor fez é muito bonito.', 'Me ajuda a cuidar da natureza.', 'Amém!'] },
    { quando: 'sempre', titulo: 'Oração pelos doentes', frases: ['Jesus, cuida das pessoas que estão dodóis.', 'Dá saúde para elas ficarem boas logo.', 'E obrigado pela minha saúde também.', 'Amém!'] },
    { quando: 'sempre', titulo: 'Oração do perdão', frases: ['Papai do Céu, me desculpa quando eu faço coisas erradas.', 'Me ajuda a pedir desculpas e a perdoar também.', 'Quero ter um coração bondoso como o de Jesus.', 'Amém!'] },
    { quando: 'sempre', titulo: 'Oração contra o medo', frases: ['Jesus, quando eu sentir medo, eu sei que o Senhor está comigo.', 'O Senhor é o meu pastor e nada vai me faltar.', 'Obrigado por me proteger sempre.', 'Amém!'] },
    { quando: 'sempre', titulo: 'Oração de gratidão', frases: ['Obrigado, Deus, pelo amor que o Senhor tem por mim.', 'Obrigado pela minha casa, pela minha cama e pelos meus brinquedos.', 'Eu também amo o Senhor!', 'Amém!'] },
    { quando: 'sempre', titulo: 'Oração pelas crianças do mundo', frases: ['Senhor, abençoa todas as crianças do mundo.', 'Que nenhuma criança fique triste ou sozinha.', 'Espalha a paz e o amor por todo lugar.', 'Amém!'] },
    { quando: 'sempre', titulo: 'Oração pelos avós', frases: ['Deus, abençoa os meus avós.', 'Obrigado pelos abraços e pelos carinhos deles.', 'Dá muita saúde e alegria para eles.', 'Amém!'] },
  ];
  const ORACOES_SEMPRE = ORACOES.filter(o => o.quando === 'sempre');

  // primeiro as orações do horário (cada uma uma vez por dia), depois as de qualquer hora, em rodízio
  function escolherOracao() {
    const periodo = periodoDoDia();
    let feitasHoje = {};
    try { feitasHoje = JSON.parse(ler('miguel-oracoes-hoje') || '{}'); } catch (e) {}
    if (feitasHoje.dia !== hoje()) feitasHoje = { dia: hoje(), titulos: [] };
    const doHorario = ORACOES.find(o =>
      (o.quando === periodo || (o.quando === 'refeicao' && horaDeComer())) &&
      !feitasHoje.titulos.includes(o.titulo));
    if (doHorario) {
      feitasHoje.titulos.push(doHorario.titulo);
      guardar('miguel-oracoes-hoje', JSON.stringify(feitasHoje));
      return doHorario;
    }
    const i = (parseInt(ler('miguel-oracao'), 10) || 0) % ORACOES_SEMPRE.length;
    guardar('miguel-oracao', String((i + 1) % ORACOES_SEMPRE.length));
    return ORACOES_SEMPRE[i];
  }

  function orar() {
    const oracao = escolherOracao();
    const frases = [{ texto: '🙏 ' + oracao.titulo, falado: oracao.titulo }]
      .concat(oracao.frases.map(f => ({ texto: f })));
    narrarSequencia('oracao', frases, VOZ_CRIANCA, 500);
  }

  function atualizarRotuloOracao() {
    const periodo = periodoDoDia();
    document.getElementById('orar-quando').textContent =
      horaDeComer() ? 'hora de comer' : { manha: 'da manhã', tarde: 'da tarde', noite: 'da noite' }[periodo];
  }
  atualizarRotuloOracao();
  setInterval(atualizarRotuloOracao, 60000);

  // ---------- Dicas para crianças ----------
  const DICAS = [
    { simbolo: '🙋', titulo: 'Respeito', frases: ['Todas as pessoas merecem respeito.', 'Trate os outros como você gostaria de ser tratado.'] },
    { simbolo: '👩‍🏫', titulo: 'Professores', frases: ['Escute a professora com atenção.', 'Quando quiser falar, levante a mão e espere a sua vez.'] },
    { simbolo: '🤝', titulo: 'Amigos', frases: ['Bons amigos dividem e brincam juntos.', 'Se alguém estiver sozinho, chame para brincar!'] },
    { simbolo: '🌳', titulo: 'Natureza', frases: ['Jogue o lixo sempre no lixo.', 'Não arranque as flores nem as folhas das árvores.'] },
    { simbolo: '💧', titulo: 'Água', frases: ['Feche a torneira enquanto escova os dentes.', 'Assim a gente economiza água para todo mundo.'] },
    { simbolo: '🐶', titulo: 'Animais', frases: ['Trate os bichinhos com carinho.', 'Nunca puxe o rabo nem as orelhas de um animal.'] },
    { simbolo: '✨', titulo: 'Palavras mágicas', frases: ['Use as palavras mágicas: por favor, obrigado e com licença.', 'Elas deixam todo mundo mais feliz!'] },
    { simbolo: '🙏', titulo: 'Pedir desculpas', frases: ['Quando a gente erra, pede desculpas.', 'Todo mundo erra, e tudo bem aprender com isso.'] },
    { simbolo: '👵', titulo: 'Os mais velhos', frases: ['Respeite os vovôs e as vovós.', 'Ofereça ajuda e o seu lugar para sentar.'] },
    { simbolo: '🌈', titulo: 'Somos diferentes', frases: ['Cada pessoa é de um jeito, e isso é bonito.', 'Alguns amigos aprendem, falam ou brincam de um jeito diferente. Respeite sempre!'] },
    { simbolo: '👂', titulo: 'Saber ouvir', frases: ['Quando alguém está falando, a gente escuta.', 'Espere a pessoa terminar para falar.'] },
    { simbolo: '⏳', titulo: 'Esperar a vez', frases: ['Na fila e na brincadeira, cada um tem a sua vez.', 'Esperar também é um jeito de respeitar.'] },
    { simbolo: '✋', titulo: 'Sem machucar', frases: ['Não bata, não empurre e não morda.', 'Se ficar bravo, respire fundo e peça ajuda a um adulto.'] },
    { simbolo: '🌬️', titulo: 'Respirar com calma', frases: ['Quando ficar nervoso, faça assim:', 'Cheire a flor... e assopre a vela.', 'Repita três vezes, bem devagar.'] },
    { simbolo: '😊', titulo: 'Sentimentos', frases: ['Tudo bem ficar triste ou bravo às vezes.', 'Conte para um adulto como você está se sentindo.'] },
    { simbolo: '🧼', titulo: 'Mãos limpinhas', frases: ['Lave as mãos antes de comer e depois de ir ao banheiro.', 'Com água e sabão, esfregando bem!'] },
    { simbolo: '🦷', titulo: 'Dentes', frases: ['Escove os dentes depois de comer e antes de dormir.', 'Dentes limpinhos, sorriso bonito!'] },
    { simbolo: '🧸', titulo: 'Guardar os brinquedos', frases: ['Depois de brincar, guarde os brinquedos.', 'Assim nada se perde e ninguém tropeça.'] },
    { simbolo: '🏠', titulo: 'Ajudar em casa', frases: ['Ajude em casa: guarde as suas coisas e arrume a sua cama.', 'A família é um time!'] },
    { simbolo: '🥦', titulo: 'Comer bem', frases: ['Coma frutas e verduras todos os dias.', 'Elas dão energia para brincar!'] },
    { simbolo: '🚸', titulo: 'Atravessar a rua', frases: ['Atravesse a rua sempre de mão dada com um adulto.', 'E olhe para os dois lados!'] },
    { simbolo: '🙅', titulo: 'Pessoas desconhecidas', frases: ['Não aceite nada de quem você não conhece.', 'Sempre avise um adulto de confiança.'] },
    { simbolo: '😴', titulo: 'Dormir bem', frases: ['Dormir bem deixa o corpo e a cabeça descansados.', 'Na hora de dormir, desligue o celular e a televisão.'] },
    { simbolo: '💬', titulo: 'Elogiar', frases: ['Diga coisas bonitas para as pessoas.', 'Um elogio deixa o dia de alguém mais feliz!'] },
    { simbolo: '🎒', titulo: 'Cuidar das coisas', frases: ['Cuide do seu material e do material dos colegas.', 'Pegou emprestado? Devolva com cuidado.'] },
  ];

  function darDica() {
    const i = (parseInt(ler('miguel-dica'), 10) || 0) % DICAS.length;
    guardar('miguel-dica', String((i + 1) % DICAS.length));
    const dica = DICAS[i];
    const frases = [{ texto: dica.simbolo + ' ' + dica.titulo, falado: dica.titulo }]
      .concat(dica.frases.map(f => ({ texto: f })));
    narrarSequencia('dica', frases, VOZ_CRIANCA, 500);
  }

  function liberarParaNarrar() {
    if (estado === 'falando') return false;
    if (estado === 'ouvindo') setEstado('parado');
    return true;
  }
  document.getElementById('orar').addEventListener('click', () => { if (liberarParaNarrar()) orar(); });
  document.getElementById('dicas').addEventListener('click', () => { if (liberarParaNarrar()) darDica(); });
  document.getElementById('ajuda').addEventListener('click', () => { if (liberarParaNarrar()) apresentar(); });

  // ---------- Modo calmo ----------
  const botaoCalmo = document.getElementById('calmo');
  function setCalmo(ligado) {
    calmo = ligado;
    document.documentElement.classList.toggle('calmo', ligado);
    botaoCalmo.setAttribute('aria-pressed', String(ligado));
    guardar('miguel-calmo', ligado ? '1' : '0');
  }
  botaoCalmo.addEventListener('click', () => {
    setCalmo(!calmo);
    if (estado === 'parado') falar(calmo ? 'Modo calmo ligado. Tudo mais tranquilo. 🌙' : 'Modo calmo desligado. ☀️');
  });
  setCalmo(ler('miguel-calmo') === '1');

  // ---------- Início ----------
  const vozGuardada = ler('miguel-voz');
  if (vozGuardada && VOZES[vozGuardada]) vozesBarra.querySelector(`[data-voz="${vozGuardada}"]`).click();
  falar(SAUDACAO[periodoDoDia()] + '! Eu sou o Miguel. Toque em mim e fale!');

  document.getElementById('comecar').addEventListener('click', () => {
    boasVindas.hidden = true;
    apresentar();
  });
  if (ler('miguel-apresentou') !== '1') boasVindas.hidden = false;
  if ('speechSynthesis' in window) speechSynthesis.getVoices();

  // ---------- Instalar no celular ----------
  const caixaInstalar = document.getElementById('instalar');
  const dicaInstalar = document.getElementById('instalar-dica');
  const jaInstalado = matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
  const ehIphone = /iphone|ipad|ipod/i.test(navigator.userAgent) ||
    (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  let pedidoInstalar = null, fechouInstalar = false;

  window.addEventListener('beforeinstallprompt', (e) => {
    e.preventDefault();
    pedidoInstalar = e;
    if (!jaInstalado && !fechouInstalar) caixaInstalar.hidden = false;
  });
  window.addEventListener('appinstalled', () => { caixaInstalar.hidden = true; });
  if (!jaInstalado && ehIphone) caixaInstalar.hidden = false;
  // alguns navegadores Android não avisam que dá para instalar: mostra a dica mesmo assim
  if (!jaInstalado && /android/i.test(navigator.userAgent)) {
    setTimeout(() => { if (!fechouInstalar) caixaInstalar.hidden = false; }, 2500);
  }

  document.getElementById('instalar-sim').addEventListener('click', async () => {
    if (pedidoInstalar) {
      pedidoInstalar.prompt();
      await pedidoInstalar.userChoice.catch(() => null);
      pedidoInstalar = null;
      caixaInstalar.hidden = true;
      return;
    }
    dicaInstalar.textContent = ehIphone
      ? 'No Safari, toque em Compartilhar (o quadrado com a setinha ⬆️) e depois em "Adicionar à Tela de Início".'
      : 'Abra o menu do navegador (⋮) e toque em "Instalar app" ou "Adicionar à tela inicial".';
    dicaInstalar.hidden = false;
  });
  document.getElementById('instalar-nao').addEventListener('click', () => {
    fechouInstalar = true;
    caixaInstalar.hidden = true;
  });

  if ('serviceWorker' in navigator && location.protocol === 'https:') {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  }

  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    falar('Abra este jogo em https (ou no navegador do celular) para usar o microfone.');
  }
})();
</script>
</body>
</html>
